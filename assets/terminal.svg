  <text x="24" y="158" class="muted in" style="animation-delay:0.25s">&gt; <tspan class="fg">whoami</tspan></text><text x="24" y="179" class="muted in" style="animation-delay:0.34s"><tspan class="green">⏺</tspan> <tspan class="fg">Bash</tspan>(whoami --verbose)</text><text x="24" y="200" class="muted in" style="animation-delay:0.43s">  ⎿  <tspan class="fg">AI engineer · Lucknow, India</tspan></text><text x="24" y="221" class="muted in" style="animation-delay:0.52s">     <tspan class="muted">I build LLM agents, retrieval systems and backend services.</tspan></text><text x="24" y="242" class="muted in" style="animation-delay:0.61s">     <tspan class="muted">Most of my time goes to the unglamorous parts: evals, guardrails,</tspan></text><text x="24" y="263" class="muted in" style="animation-delay:0.70s">     <tspan class="muted">cost control and failure handling.</tspan></text><text x="24" y="292" class="muted in" style="animation-delay:0.79s">&gt; <tspan class="fg">cat principles.md</tspan></text><text x="24" y="313" class="muted in" style="animation-delay:0.88s"><tspan class="green">⏺</tspan> <tspan class="fg">Read</tspan>(principles.md)</text><text x="24" y="334" class="muted in" style="animation-delay:0.97s">  ⎿  <tspan class="muted"><tspan class="accent">Grounded answers</tspan> — cite sources; say "I don't know" instead of guessing</tspan></text><text x="24" y="355" class="muted in" style="animation-delay:1.06s">     <tspan class="muted"><tspan class="accent">Cheap first, LLM last</tspan> — rules settle the easy 80%, the model gets the rest</tspan></text><text x="24" y="376" class="muted in" style="animation-delay:1.15s">     <tspan class="muted"><tspan class="accent">Failing safely</tspan> — guardrails, human-review gates, fail-closed services</tspan></text><text x="24" y="397" class="muted in" style="animation-delay:1.24s">     <tspan class="muted"><tspan class="accent">Proof, not vibes</tspan> — eval gates run before anything ships</tspan></text><text x="24" y="426" class="muted in" style="animation-delay:1.33s">&gt; <tspan class="fg">ls ~/featured</tspan></text><text x="24" y="447" class="muted in" style="animation-delay:1.42s"><tspan class="green">⏺</tspan> <tspan class="fg">Bash</tspan>(ls ~/featured  # 23 repos total)</text><text x="24" y="468" class="muted in" style="animation-delay:1.51s">  ⎿  <tspan class="fg"><tspan class="accent" font-weight="bold">coverwise</tspan><tspan class="dim"> · Python · LangGraph · ChromaDB · K8s</tspan></tspan></text><text x="24" y="489" class="muted in" style="animation-delay:1.60s">        Cited Medicare coverage agent: hybrid RAG, PII guardrails, eval gate</text><text x="24" y="513" class="muted in" style="animation-delay:1.69s">     <tspan class="fg"><tspan class="accent" font-weight="bold">support-triage</tspan><tspan class="dim"> · Python · SQLite</tspan></tspan></text><text x="24" y="534" class="muted in" style="animation-delay:1.78s">        Answer from docs or escalate: BM25 over ~8k chunks + cost-weighted model</text><text x="24" y="558" class="muted in" style="animation-delay:1.87s">     <tspan class="fg"><tspan class="accent" font-weight="bold">echoroute</tspan><tspan class="dim"> · Python</tspan></tspan></text><text x="24" y="579" class="muted in" style="animation-delay:1.96s">        6-stage cascade picks notify / digest / mute before any LLM call</text><text x="24" y="603" class="muted in" style="animation-delay:2.05s">     <tspan class="fg"><tspan class="accent" font-weight="bold">distrocache</tspan><tspan class="dim"> · Python · gRPC · FastAPI</tspan></tspan></text><text x="24" y="624" class="muted in" style="animation-delay:2.14s">        Distributed KV cache: consistent hashing, replicated nodes</text><text x="24" y="648" class="muted in" style="animation-delay:2.23s">     <tspan class="fg"><tspan class="accent" font-weight="bold">careeros</tspan><tspan class="dim"> · React · FastAPI</tspan></tspan></text><text x="24" y="669" class="muted in" style="animation-delay:2.32s">        AI job platform: fit analysis, resume rewrite, ATS scoring (live demo)</text><text x="24" y="693" class="muted in" style="animation-delay:2.41s">     <tspan class="fg"><tspan class="accent" font-weight="bold">document-pile-analyst</tspan><tspan class="dim"> · Python</tspan></tspan></text><text x="24" y="714" class="muted in" style="animation-delay:2.50s">        Multi-agent MSA/SLA analyst: OCR, extraction, human approval gate</text><text x="24" y="738" class="muted in" style="animation-delay:2.59s">     <tspan class="fg"><tspan class="accent" font-weight="bold">project-terminus</tspan><tspan class="dim"> · Go · Docker</tspan></tspan></text><text x="24" y="759" class="muted in" style="animation-delay:2.68s">        Containerized tasks for a benchmark of frontier AI coding agents</text><text x="24" y="783" class="muted in" style="animation-delay:2.77s">     <tspan class="muted"><tspan class="dim">also: ats-hris-integration · recruiting-workflow-engine · deep-packet-analyzer · +6 more</tspan></tspan></text><text x="24" y="812" class="muted in" style="animation-delay:2.86s">&gt; <tspan class="fg">git log --all-repos --recent</tspan></text><text x="24" y="833" class="muted in" style="animation-delay:2.95s"><tspan class="green">⏺</tspan> <tspan class="fg">Push</tspan>(careeros-ai-job-platform)</text><text x="24" y="854" class="muted in" style="animation-delay:3.04s">  ⎿  <tspan class="muted">Validate LLM output with Pydantic; replace silent mock fallback with explicit DEMO_MODE</tspan></text><text x="24" y="875" class="muted in" style="animation-delay:3.13s"><tspan class="green">⏺</tspan> <tspan class="fg">Push</tspan>(multi-domain-support-triage)</text><text x="24" y="896" class="muted in" style="animation-delay:3.22s">  ⎿  <tspan class="muted">Fix company tagging when a parent folder is named claude/visa/hackerrank</tspan></text><text x="24" y="917" class="muted in" style="animation-delay:3.31s"><tspan class="green">⏺</tspan> <tspan class="fg">Push</tspan>(distrocache-distributed-kv)</text><text x="24" y="938" class="muted in" style="animation-delay:3.40s">  ⎿  <tspan class="muted">fix: checker runner retries a transient /metrics poll and never exits 0 without a verdi…</tspan></text><text x="24" y="967" class="muted in" style="animation-delay:3.49s">&gt; <tspan class="fg">cat toolbox.txt</tspan></text><text x="24" y="988" class="muted in" style="animation-delay:3.58s"><tspan class="green">⏺</tspan> <tspan class="fg">Read</tspan>(toolbox.txt)</text><text x="24" y="1009" class="muted in" style="animation-delay:3.67s">  ⎿  <tspan class="muted"><tspan class="accent">languages </tspan> <tspan class="fg">Python  TypeScript  JavaScript  C++  Go</tspan></tspan></text><text x="24" y="1030" class="muted in" style="animation-delay:3.76s">     <tspan class="muted"><tspan class="accent">ai / llm  </tspan> <tspan class="fg">Claude Code  LangChain  LangGraph  ChromaDB</tspan></tspan></text><text x="24" y="1051" class="muted in" style="animation-delay:3.85s">     <tspan class="muted"><tspan class="accent">backend   </tspan> <tspan class="fg">FastAPI  React  gRPC  PostgreSQL  SQLite</tspan></tspan></text><text x="24" y="1072" class="muted in" style="animation-delay:3.94s">     <tspan class="muted"><tspan class="accent">infra     </tspan> <tspan class="fg">Docker  Kubernetes  AWS  Cloud Run  Airflow</tspan></tspan></text>

